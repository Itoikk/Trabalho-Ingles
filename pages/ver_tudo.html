<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhos Enviados</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            <h1 class="m-0">Inglês</h1>

            <nav>
                <a href="../index.html">Página inicial</a>
                <a href="envio.html">Enviar</a>
                <a href="ver_tudo.html" class="active">Ver todos</a>
            </nav>

            <div class="d-flex gap-2">
                <button class="btn-login">Login</button>
                <button class="btn-signup">Sign-up</button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Trabalhos Enviados</h2>
                <p class="text-muted m-0">Explore os documentos enviados pela comunidade.</p>
            </div>
            <a href="envio.html" class="btn btn-primary d-flex align-items-center gap-2">
                <i class="bi bi-cloud-arrow-up-fill"></i> Novo Envio
            </a>
        </div>

        <div id="listaPDFs" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary mb-3" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="text-muted">Buscando trabalhos...</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script.js"></script>
</body>

</html>
