<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Trabalho</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            <h1 class="m-0">Inglês</h1>

            <nav>
                <a href="../index.html">Página inicial</a>
                <a href="envio.html" class="active">Enviar</a>
                <a href="ver_tudo.html">Ver todos</a>
            </nav>

            <div class="d-flex gap-2">
                <button class="btn-login">Login</button>
                <button class="btn-signup">Sign-up</button>
            </div>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-cloud-arrow-up-fill fs-3"></i>
                        </div>
                        <h2 class="fw-bold m-0">Enviar Trabalho</h2>
                        <p class="text-muted mt-2">Preencha as informações abaixo e envie seu arquivo em formato PDF.</p>
                    </div>

                    <form id="formUpload" onsubmit="event.preventDefault(); enviarPDF();">
                        
                        <div class="mb-3">
                            <label for="nome-trabalho" class="form-label fw-semibold">Título do Trabalho</label>
                            <input type="text" class="form-control form-control-lg fs-6" id="nome-trabalho" placeholder="Ex: Super Mario Bross" required>
                        </div>

                        <div class="mb-3">
                            <label for="descricao-trabalho" class="form-label fw-semibold">Descrição</label>
                            <textarea class="form-control" id="descricao-trabalho" rows="3" placeholder="Resuma brevemente o tema do trabalho..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="colaboradores-trabalho" class="form-label fw-semibold">Colaboradores / Autores</label>
                            <input type="text" class="form-control" id="colaboradores-trabalho" placeholder="Ex: Maria Silva, João Santos">
                        </div>

                        <div class="mb-4">
                            <label for="arquivo-trabalho" class="form-label fw-semibold">Arquivo (Apenas PDF)</label>
                            <input type="file" class="form-control" id="arquivo-trabalho" accept="application/pdf" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-send-fill"></i> Enviar Arquivo
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../script.js"></script>
</body>

</html>
