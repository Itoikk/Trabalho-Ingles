<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | PDF Repository</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">PDF Repository - Admin</span>
            <button class="btn btn-outline-light btn-sm" onclick="sair()">Log Out</button>
        </div>
    </nav>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">Registered Groups</h4>
            <button class="btn btn-dark btn-sm" onclick="abrirModalNovoGrupo()">+ New Group</button>
        </div>

        <div id="msg" class="alert d-none" role="alert"></div>

        <table class="table table-hover bg-white shadow-sm">
            <thead>
                <tr>
                    <th>Group</th>
                    <th>Code</th>
                    <th>Members</th>
                    <th class="text-end">Actions</th>
                </tr>
            </thead>
            <tbody id="tabela-grupos">
                <!-- preenchido via JS -->
            </tbody>
        </table>

    </div>

    <!-- Modal de edição -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Group</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="edit-id">
                    <label class="form-label">Group Name</label>
                    <input type="text" class="form-control" id="edit-nome">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-dark" onclick="salvarEdicao()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
