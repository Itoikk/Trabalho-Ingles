<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil | Repositório de PDFs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a href="../index.html" class="navbar-brand mb-0 h1">Repositório de Slides</a>
      <button class="btn btn-sm btn-outline-light" onclick="sair()">Sair</button>
    </div>
  </nav>

  <div class="container" style="max-width: 500px;">

    <div id="msg" class="alert d-none" role="alert"></div>

    <!-- Dados pessoais -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Meus dados</h5>
        <form id="form-dados">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" id="perfil-nome" required>
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" id="perfil-email" required>
          </div>
          <button type="submit" class="btn btn-dark">Salvar dados</button>
        </form>
      </div>
    </div>

    <!-- Trocar senha -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Trocar senha</h5>
        <form id="form-senha">
          <div class="mb-3">
            <label class="form-label">Nova senha</label>
            <input type="password" class="form-control" id="nova-senha" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirmar nova senha</label>
            <input type="password" class="form-control" id="confirma-senha" minlength="6" required>
          </div>
          <button type="submit" class="btn btn-dark">Trocar senha</button>
        </form>
      </div>
    </div>

    <!-- Grupo -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Meu grupo</h5>

        <!-- Mostrado se já tiver grupo -->
        <div id="area-com-grupo" class="d-none">
          <p class="mb-1"><strong id="nome-grupo-atual"></strong></p>
          <p class="text-muted small">Código do grupo: <code id="codigo-grupo-atual"></code></p>
          <button class="btn btn-sm btn-outline-danger" onclick="sairDoGrupo()">Sair do grupo</button>
        </div>

        <!-- Mostrado se ainda não tiver grupo -->
        <div id="area-sem-grupo" class="d-none">
          <p class="text-muted small">Você ainda não faz parte de um grupo.</p>
          <form id="form-entrar-grupo" class="d-flex gap-2">
            <input type="text" class="form-control" id="codigo-grupo" placeholder="Ex: GRP-A3F9" required>
            <button type="submit" class="btn btn-dark">Entrar</button>
          </form>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
