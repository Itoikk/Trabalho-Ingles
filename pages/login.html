<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Repositório de PDFs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="width: 100%; max-width: 380px;">
            <div class="card-body p-4">

                <!-- Abas -->
                <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
                    <li class="nav-item flex-fill text-center" role="presentation">
                        <button class="nav-link active w-100" id="tab-login-btn" data-bs-toggle="tab"
                            data-bs-target="#tab-login" type="button" role="tab">
                            Entrar
                        </button>
                    </li>
                    <li class="nav-item flex-fill text-center" role="presentation">
                        <button class="nav-link w-100" id="tab-cadastro-btn" data-bs-toggle="tab"
                            data-bs-target="#tab-cadastro" type="button" role="tab">
                            Cadastrar
                        </button>
                    </li>
                </ul>

                <!-- Mensagem de erro/sucesso -->
                <div id="msg" class="alert d-none" role="alert"></div>

                <div class="tab-content">

                    <!-- LOGIN -->
                    <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="login-email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" id="login-senha" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Entrar</button>
                        </form>
                    </div>

                    <!-- CADASTRO -->
                    <div class="tab-pane fade" id="tab-cadastro" role="tabpanel">
                        <form id="form-cadastro">
                            <div class="mb-3">
                                <label class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="cadastro-email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Senha</label>
                                <input type="password" class="form-control" id="cadastro-senha" minlength="6" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirmar senha</label>
                                <input type="password" class="form-control" id="cadastro-confirma" minlength="6"
                                    required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Criar conta</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/login.js"></script>

</body>
</html>
